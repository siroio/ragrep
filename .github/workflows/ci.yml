name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Go tests and build (cgo)
        env:
          CGO_ENABLED: '1'
        run: |
          go -C src test -p=1 ./...
          go -C src build ./cmd/ragrep
      - name: Python tests
        run: |
          python -m unittest tools/ci/test_verify_go_tests.py tools/ci/test_release_verify.py tools/ci/test_staged_smoke.py
          python tools/release/test_release.py
          python -m unittest discover -s tools/product_eval -p "test_*.py"
